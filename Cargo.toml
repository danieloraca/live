[package]
name = "live"
version = "0.1.0"
edition = "2024"

[dependencies]
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
signal-hook = "0.3.18"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = true
strip = true
opt-level = 3
panic = 'abort'
codegen-units = 1
